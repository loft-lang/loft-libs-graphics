[package]
name = "gpu_host"
version = "0.1.0"
loft = ">=2026.10.0"
repository = "loft-libs-graphics"
description = "Opens a gpu device on the backend this machine has: Metal on a Mac, OpenGL elsewhere and where Metal is absent, Vulkan on Linux by name"
categories  = ["graphics", "game"]

# ⚠ FIRST release, so both floors are this release itself.
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads

# The one package that names backends: a game depends on this and on `gpu`, never on a backend.
[dependencies]
gpu = ">=0.3.0"
gpu_gl = ">=0.2.0"
gpu_metal = ">=0.1.0"
gpu_vulkan = ">=0.1.0"

[library]
entry = "src/gpu_host.loft"
