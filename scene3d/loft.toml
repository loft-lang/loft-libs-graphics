[package]
name = "scene3d"
version = "0.6.1"
loft = ">=2026.10.0"
repository = "loft-libs-graphics"
description = "A 3D scene a game's view gives once — tiles of faces, the cells' light, actors — drawn through gpu"
categories  = ["graphics", "game"]

# ⚠ FIRST release, so both floors are this release itself.
api_compatible_with  = "0.6.1"   # the API is unchanged; raised with the data floor, which the check cannot tell apart (loft#2598)
data_compatible_with = "0.6.1"   # its records hold gpu's, which gpu 0.4.1 reshaped

[dependencies]
gpu = ">=0.4.1"

[library]
entry = "src/scene3d.loft"
