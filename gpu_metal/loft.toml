[package]
name = "gpu_metal"
version = "0.2.3"
# Its shim includes gpu's header by the dependency's name (`gpu/gpu_backend.h`), which loft
# provides from the daily build that carries its decision C165 on.
loft = ">=2026.11.20261116"
repository = "loft-libs-graphics"
description = "The Metal backend of gpu: a Mac's GPU through Metal, in a window of its own"
categories  = ["graphics", "game"]

# ⚠ FIRST release, so both floors are this release itself.
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads

[dependencies]
gpu = ">=0.4.2"

[library]
entry = "src/gpu_metal.loft"

# The backend's table in C99 (c/gpu_metal.c).  The window system and Metal are opened at run
# time through the Objective-C runtime; on a machine that is not a Mac the table is none.
[c]
shim = "c/gpu_metal.c"

# What this package opens that it did not write (loft THIRDPARTY.md).
[thirdparty.metal]
kind     = "system"
names    = ["Metal", "QuartzCore"]
provider = "macOS's Metal and QuartzCore frameworks, opened at run time"

[thirdparty.windowing]
kind     = "system"
names    = ["AppKit", "objc"]
provider = "macOS's AppKit and the Objective-C runtime, opened at run time"
