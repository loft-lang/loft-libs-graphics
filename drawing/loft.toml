[package]
name = "drawing"
version = "0.4.0"
loft = ">=2026.8.0"
repository = "loft-libs-graphics"
description = "Render a .draw scene — a sprite authored as lines of text — pixel-identically to the Python renderer it replaces"
categories = ["graphics", "asset-format"]

# DECLARED BREAK — the brush stroke (`Brush` / `Lock`) grew two public records:
# `Op` gained `style` and `brush`, `Sketch` gained `brushes` and `base_dir`, and
# `OpKind` a variant.  The same shape as 0.3.0's `Elem.first_at`, and both halves
# are real on two axes a caller reaches differently:
#
# DATA: each record grows a slot, so a store written by 0.3.0 is read shifted.
#
# API: a whole-record read answers differently — `{op:j}` gains keys, as does any
# reflection walk over the fields.  Note what it is NOT: construction.  A literal
# may omit any field in loft (`Op { }` compiles, and each omitted field takes its
# declared default or its type's zero), so source written against 0.3.0 keeps
# compiling.  That is the direction an author probes, which is what makes this
# read additive when it is not — the same trap imaging's `Pixel.a` documents.
# Declaring it is the supported move.
api_compatible_with  = "0.4.0"
data_compatible_with = "0.4.0"

[dependencies]
graphics = ">=0.8.0"
imaging  = ">=0.3.2"   # `Brush … file=`: a PNG footprint decoded to pixels

[library]
entry = "src/drawing.loft"
