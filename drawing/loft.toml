[package]
name = "drawing"
version = "0.3.0"
loft = ">=2026.8.0"
repository = "loft-libs-graphics"
description = "Render a .draw scene — a sprite authored as lines of text — pixel-identically to the Python renderer it replaces"
categories = ["graphics", "asset-format"]

# DECLARED BREAK — `pub struct Elem` gained `first_at`, and both halves are real,
# on two axes a caller reaches differently.
#
# DATA: the record grows a slot, so a store written by 0.2.0 is read shifted.
#
# API: a whole-record read answers differently — `{e:j}` gains a key, as does any
# reflection walk over the fields.  Note what it is NOT: construction.  A literal
# may omit any field in loft (`Elem { }` compiles, and each omitted field takes
# its declared default or its type's zero), so source written against 0.2.0 keeps
# compiling.  That is the direction an author probes, which is what makes this
# read additive when it is not — the same trap imaging's `Pixel.a` documents.
# (An earlier version of this comment called the API half a false positive, on
# loft#1192; measuring it closed that issue the other way.)
api_compatible_with  = "0.3.0"
                                 # `first_at`, which the metric report needs to
                                 # order elements by first ink rather than by
                                 # where the `name` line sits.  It reads as
                                 # additive and is not, the same way imaging's
                                 # `Pixel.a` did: the field carries `= -1`, so
                                 # source writing `Elem{...}` without it still
                                 # compiles — that is the direction an author
                                 # probes.  The two axes it does not reach: the
                                 # WRITE side gains a key (`{e:j}` and any
                                 # reflection walk), and the record grows a slot,
                                 # so a store written by 0.2.0 is not read by
                                 # this one.  Declaring it is the supported move.
data_compatible_with = "0.3.0"   # Elem gained a slot; a persisted sketch from an
                                 # older release reads shifted

[dependencies]
graphics = ">=0.8.0"

[library]
entry = "src/drawing.loft"
