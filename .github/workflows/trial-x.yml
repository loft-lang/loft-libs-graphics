name: trial-x
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y xvfb libx11-dev >/dev/null
          cc -O1 trial/xprobe.c -o xprobe -lX11
          Xvfb -help 2>&1 | grep -i -A1 maxclients || true
          Xvfb :99 -screen 0 1920x1200x24 -nolisten tcp -audit 4 > xvfb.log 2>&1 &
          sleep 2; export DISPLAY=:99
          echo "== one process, no window"; ./xprobe 3000 0
          echo "== one process, a window";  ./xprobe 3000 1
          echo "== four processes, a window"; for k in 1 2 3 4; do ./xprobe 1500 1 & done; wait
          echo "== rejections the server logged"; grep -i -c "reject\|refus\|maximum" xvfb.log || true; grep -i "reject\|refus\|maximum" xvfb.log | sort | uniq -c | head -5
          grep -c "" xvfb.log; tail -3 xvfb.log
          pkill Xvfb; sleep 1
          Xvfb :99 -screen 0 1920x1200x24 -nolisten tcp -maxclients 2048 > xvfb2.log 2>&1 &
          sleep 2
          echo "== -maxclients 2048: one process, a window"; ./xprobe 3000 1
          echo "== -maxclients 2048: four processes, a window"; for k in 1 2 3 4; do ./xprobe 1500 1 & done; wait
