[package]
name    = "gridmesh"
version = "0.2.8"
loft    = ">=2026.7.2"

api_compatible_with  = "0.2.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.2.0"   # oldest own release whose stored data this reads
width32 = true   # its tests pass in a 32-bit program (loft --width 32); the library CI runs them there
[library]
entry = "src/gridmesh.loft"
