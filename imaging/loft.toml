[package]
name = "imaging"
version = "0.5.2"
loft = ">=2026.10.0"
api_compatible_with  = "0.4.0"   # DECLARED BREAK: `png()` answers `Image?`.  It always
                                 # answered null on a missing or undecodable file; the
                                 # declaration said `Image`, and a caller handing the
                                 # result on (`f(img)` with `fn f(i: Image)`) now gets
                                 # the `(N-Store)` warning a library CI denies until it
                                 # discharges (`?? Image { }`).  0.3.x: `Pixel` gained
                                 # `a` — its note is in the 0.3.0 history.
data_compatible_with = "0.3.0"   # Pixel went 3 bytes -> 4; a persisted Image from
                                 # an older release reads as shifted colour
repository = "loft-libs-graphics"

[library]
entry = "src/imaging.loft"

# The native part is C99 the package ships and loft builds itself with `cc` (and with `clang`
# for the two wasm targets): `c/imaging_png.c` over the vendored lodepng (`c/vendor/lodepng`,
# zlib license), bound by the `#c` declarations in src/imaging.loft.  Memory in, memory out —
# loft reads and writes the file — so every target, a 32-bit device included, decodes and
# encodes with the same code.  No Rust crate, no rustc, no wasm bridge.
[c]
shim = "c/imaging_png.c"

# What this package ships, compiles in or opens that it did not write (loft THIRDPARTY.md).
[thirdparty.lodepng]
kind       = "vendored"
path       = "c/vendor/lodepng"
upstream   = "https://github.com/lvandeve/lodepng"
commit     = "ed6fe5825c6a4fbb7f58ab35a4231c7543cd452a"
digest     = "sha256:33a66ec7e2416405ed1e4c84d9e6e3526d8cb96d7e405dbe99c5abeae1a6ce96"
renames    = { "lodepng.c" = "lodepng.cpp" }
advisories = ["nvd:lodepng", "osv:commit"]

[thirdparty.lodepng.reviewed]
CVE-2019-17178 = "fixed: HuffmanTree_makeFromFrequencies allocates with lodepng_malloc and has no realloc; our pin is 2026-05-28"
CVE-2022-44081 = "not-reached: the crash is in pngdetail, a separate example program; only lodepng.c and lodepng.h are vendored"
CVE-2026-112020 = "not-reached: getFilterTypesInterlaced is in lodepng_util.cpp, which is not vendored and has no counterpart in lodepng.c"
