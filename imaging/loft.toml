[package]
name = "imaging"
version = "0.3.0"
loft = ">=0.8"
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.3.0"   # Pixel went 3 bytes -> 4; a persisted Image from
                                 # an older release reads as shifted colour
repository = "loft-libs-graphics"

[library]
entry = "src/imaging.loft"
native = "loft_imaging"

# Declares the COMPILE-time native crate so `--native` links the rlib
# (`add_native_extern_flags`), not just the runtime dylib above.
# Without it `loft --native test` fails with P269
# "no implementation in any registered native crate".
[native]
crate = "loft-imaging"

# Browser (`--html`) bridge for the store-mutating `#native` fns.  The
# `--html` codegen routes `n_load_png`/`n_save_png` to the `pub fn`s in
# `wasm/src/lib.rs`, which decode/encode via host imports (`loft_gl.*`
# provided by `wasm/host.js`: the browser's Image/Canvas API).  The
# bridge crate path-deps the sibling `loft` checkout (`../../../loft`),
# the pattern the crypto/web bridges use — no crates.io publish needed.
[wasm.bridge]
crate = "loft-imaging-wasm"
host_js = "wasm/host.js"

[wasm.bridge.routes]
n_load_png = "imaging_load_png"
n_save_png = "imaging_save_png"
