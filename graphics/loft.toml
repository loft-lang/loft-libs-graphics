[package]
name = "graphics"
version = "0.12.0"
loft = ">=2026.10.0"
# 0.10 is a declared break: the integer-handle API of 0.9 (`gl_*`, `audio_*`, `Painter2D`,
# `SpriteSheet`, `group_vbos_*`, `gl_load_font`) is gone for objects the caller holds — `Window`,
# `Shader`, `GpuMesh`, `Texture`, `Framebuffer`, `Painter`, `Sprites`, `GroupMeshes`, `Font` —
# so a 0.9 consumer stays on 0.9 until it moves (@PLN208).
# 0.12 is a declared break: `Canvas.data` is a `vector<u32>` (4 bytes a pixel) and
# `Glyph.coverage` a `vector<u8>`.  A caller that writes `data` masks the colour to 32 bits; a
# stored canvas or glyph has the narrower layout.  It needs a loft whose `u32` holds all 32 bits.
api_compatible_with  = "0.12.0"  # oldest own release this is a drop-in for
data_compatible_with = "0.12.0"  # oldest own release whose stored data this reads
repository = "loft-libs-graphics"

[library]
entry = "src/graphics.loft"

# The native part is C the package ships and loft builds itself with `cc` (c/graphics_gl.c,
# bound by the `#c` declarations in src/graphics.loft): the window and its GL context through
# libX11 and libGL opened at run time on Linux, the page's WebGL2 in a browser.  No Rust crate.
[c]
shim = "c/graphics_gl.c"

[dependencies]
mesh3d = ">=0.1.1"
glb = ">=0.1.1"
imaging = ">=0.5.1"

# What this package ships, compiles in or opens that it did not write (loft THIRDPARTY.md).
[thirdparty.opengl]
kind     = "system"
names    = ["GL", "OpenGL"]
provider = "the GPU driver's OpenGL (Mesa or the vendor driver on Linux, macOS's OpenGL framework), opened at run time"

[thirdparty.windowing]
kind     = "system"
names    = ["X11", "Xtst", "AppKit", "objc", "CoreGraphics"]
provider = "the OS windowing and input libraries (Xorg / XWayland and XTest on Linux, AppKit and CoreGraphics on macOS), opened at run time"
