[package]
name = "graphics"
version = "0.8.1"
loft = ">=2026.7.2"
api_compatible_with  = "0.4.2"   # oldest own release this is a drop-in for
data_compatible_with = "0.4.2"   # oldest own release whose stored data this reads
repository = "loft-libs-graphics"

[library]
entry = "src/graphics.loft"
native = "loft_graphics_native"

[native]
crate = "loft-graphics-native"
runtime-libs = "libGL.so.1, libasound.so.2"
build-deps = "libgl-dev, libasound2-dev"

[dependencies]
mesh3d = ">=0.1.1"
glb = ">=0.1.1"
