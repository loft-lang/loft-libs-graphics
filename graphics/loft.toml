[package]
name = "graphics"
version = "0.14.0"
loft = ">=2026.11.20261113"
# 0.10 is a declared break: the integer-handle API of 0.9 (`gl_*`, `audio_*`, `Painter2D`,
# `SpriteSheet`, `group_vbos_*`, `gl_load_font`) is gone for objects the caller holds — `Window`,
# `Shader`, `GpuMesh`, `Texture`, `Framebuffer`, `Painter`, `Sprites`, `GroupMeshes`, `Font` —
# so a 0.9 consumer stays on 0.9 until it moves (@PLN208).
# 0.12 is a declared break: `Canvas.data` is a `vector<u32>` (4 bytes a pixel) and
# `Glyph.coverage` a `vector<u8>`.  A caller that writes `data` masks the colour to 32 bits; a
# stored canvas or glyph has the narrower layout.  It needs a loft whose `u32` holds all 32 bits.
# 0.14 is a declared break: the window draws through `gpu` and holds its own state, so a call
# that reads or changes that state has the window in its hand.  A draw names its window and its
# textures (`mesh.draw(w, shader, texture)`), a function that draws takes a `Window` and not a
# `const Window`, and a framebuffer is made of its textures (README § Moving from 0.13).
api_compatible_with  = "0.14.0"  # oldest own release this is a drop-in for
data_compatible_with = "0.12.0"  # oldest own release whose stored data this reads
repository = "loft-libs-graphics"
description = "A 2D canvas, windows, drawing on the GPU and text for loft (meshes and glTF are mesh3d and glb)"

[library]
entry = "src/graphics.loft"

# No native part of its own: the window and the GPU are `gpu`'s, through its OpenGL backend.
[dependencies]
mesh3d = ">=0.1.1"
glb = ">=0.1.1"
imaging = ">=0.5.1"
gpu = ">=0.4.1"
gpu_gl = ">=0.3.0"

# Not part of the library: `desktop/` holds the programs that send a window real key and mouse
# events to check what it reports.  They are built by `desktop/input.sh` and `input_mac.sh`.
[thirdparty.input-check]
kind     = "system"
names    = ["Xtst", "CoreGraphics"]
provider = "the OS's own way to send input events (XTest on Linux, CoreGraphics on macOS), linked by the input check's sender only"
