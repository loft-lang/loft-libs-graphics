[package]
name = "loft-graphics-native"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# graphics keeps its hand-written `loft_register!` + `loft_register_bridges!`
# (it needs symbol remaps `loft_* => n_*` and a partial bridges list —
# `loft_save_png`/`loft_rasterize_text_into` use `vec_wrapper!` with no
# `#[loft_native]`), so it does NOT use the source-scanning `loft-ffi-build`
# generator (that would emit bare idents and a bridge for every symbol, neither
# of which graphics' dual-ABI layout matches).
loft-ffi = "0.1"
loft-ffi-macros = "0.1"
glutin = "0.32"
gl = "0.14"
raw-window-handle = "0.6"
glutin-winit = "0.5"
winit = "0.30"
fontdue = "0.9"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
