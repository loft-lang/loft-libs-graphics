[package]
name = "loft-graphics-native"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# graphics keeps its hand-written `loft_register!` + `loft_register_bridges!`
# (it needs symbol remaps `loft_* => n_*` and a partial bridges list —
# `loft_save_png`/`loft_rasterize_text_into` use `vec_wrapper!` with no
# `#[loft_native]`), so it does NOT use the source-scanning `loft-ffi-build`
# generator (that would emit bare idents and a bridge for every symbol, neither
# of which graphics' dual-ABI layout matches).
loft-ffi = "0.1"
loft-ffi-macros = "0.1"
gl = "0.14"
fontdue = "0.9"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }

# The window + GL-context layer, which is desktop-only.  Neither crate has a
# wasm32 target — winit refuses with "the platform you're compiling for is not
# supported", glutin with "please select at least one api backend" — and an
# unconditional dependency on them is what kept the whole package off
# `--native-wasm`, including the pure canvas and PNG halves that have nothing
# to do with a window.  Every other dependency here cross-builds clean, so the
# split runs exactly along "needs a display server".
#
# `gl` stays unconditional on purpose: it is a table of function pointers, so
# it compiles anywhere, and keeping it shared means the ~90 GL entry points
# need no wasm32 twin — they are already behind `GL_READY`, which no headless
# target can set.  See src/lib.rs § Headless targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"
glutin-winit = "0.5"
winit = "0.30"
raw-window-handle = "0.6"
